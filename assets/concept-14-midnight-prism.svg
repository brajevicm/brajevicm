<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Miloš Brajević — Senior Full-Stack Software Engineer</title>
  <desc id="d">A dark profile banner with luminous prismatic accents.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CFFB1"/>
