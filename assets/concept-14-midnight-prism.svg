  <text x="88" y="246" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="56" font-weight="680" letter-spacing="-2">Software Engineer</text>
