  <text x="56" y="148" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.4">Senior Full-Stack</text>
  <text x="56" y="184" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Software Engineer</text>

