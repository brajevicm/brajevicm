<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Miloš Brajević — Icon Bento</title>
  <desc id="d">A refined full-stack bento with category icons and technology details.</desc>
  <rect width="1200" height="440" rx="30" fill="#F4F1EA"/>

